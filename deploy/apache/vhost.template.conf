# Apache-vhost-Vorlage fuer eine KI-Tool-Installation.
# Platzhalter __DOMAIN__ und __APP_DIR__ ersetzen, nach
# /etc/apache2/sites-available/ki-tool.conf kopieren, dann:
#   sudo a2ensite ki-tool && sudo systemctl reload apache2
#   sudo certbot --apache -d __DOMAIN__      (fuer HTTPS)

<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __APP_DIR__

    <Directory __APP_DIR__>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/ki-tool-error.log
    CustomLog ${APACHE_LOG_DIR}/ki-tool-access.log combined
</VirtualHost>
